<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="p-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#1a2335" />
    </linearGradient>
    <linearGradient id="accent-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00dce6" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with precision dashes -->
  <circle cx="160" cy="160" r="148" fill="url(#p-grad)" stroke="#1e293b" stroke-width="2" />
  <circle cx="160" cy="160" r="140" fill="none" stroke="url(#accent-ring)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />

  <!-- Code bracket geometry -->
  <path d="M 95 110 L 70 160 L 95 210" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 225 110 L 250 160 L 225 210" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="175" y1="110" x2="145" y2="210" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Central Monogram -->
  <rect x="110" y="110" width="100" height="100" rx="20" fill="#0b0f1a" stroke="#1e293b" stroke-width="1.5" />
  <text x="160" y="172" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="700" text-anchor="middle">P</text>

  <!-- Terminal prompt tag -->
  <rect x="85" y="240" width="150" height="26" rx="13" fill="#090d16" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="102" cy="253" r="3.5" fill="#00f2fe" />
  <text x="114" y="257" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">pranit.builds</text>
</svg>
