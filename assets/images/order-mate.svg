<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="om-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#om-bg)" rx="8" />
  <rect width="800" height="450" fill="none" stroke="#1e293b" stroke-width="1.5" rx="8" />

  <!-- Window Header -->
  <rect width="800" height="42" fill="#0b0f1a" rx="8 8 0 0" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#ff5f56" />
  <circle cx="42" cy="21" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="21" r="5" fill="#27c93f" />
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ordermate.system // order-management</text>

  <!-- App Header & Top Controls -->
  <rect x="30" y="60" width="140" height="30" rx="4" fill="#161f30" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
  <text x="45" y="80" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15">📦 ORDER MATE</text>

  <rect x="630" y="60" width="140" height="30" rx="4" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1" />
  <text x="700" y="80" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">+ New Order</text>

  <!-- Metric / Overview Summary Cards -->
  <g transform="translate(30, 105)">
    <rect width="170" height="68" rx="6" fill="#101522" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">TOTAL ORDERS</text>
    <text x="14" y="52" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">1,248</text>
    <text x="110" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Active</text>
  </g>

  <g transform="translate(220, 105)">
    <rect width="170" height="68" rx="6" fill="#101522" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">PROCESSING</text>
    <text x="14" y="52" fill="#ffbd2e" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">38</text>
    <text x="100" y="50" fill="#ffbd2e" font-family="'JetBrains Mono', monospace" font-size="10">In Kitchen</text>
  </g>

  <g transform="translate(410, 105)">
    <rect width="170" height="68" rx="6" fill="#101522" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">OUT FOR DELIVERY</text>
    <text x="14" y="52" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">19</text>
    <text x="115" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Dispatched</text>
  </g>

  <g transform="translate(600, 105)">
    <rect width="170" height="68" rx="6" fill="#101522" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">COMPLETED</text>
    <text x="14" y="52" fill="#27c93f" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">1,191</text>
    <text x="110" y="50" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="10">Fulfilled</text>
  </g>

  <!-- Main Order Table Mockup -->
  <g transform="translate(30, 190)">
    <rect width="740" height="230" rx="8" fill="#101522" stroke="#1e293b" stroke-width="1" />
    
    <!-- Table Header -->
    <rect width="740" height="38" rx="8 8 0 0" fill="#141c2c" />
    <line x1="0" y1="38" x2="740" y2="38" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ORDER ID</text>
    <text x="140" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CUSTOMER / TABLE</text>
    <text x="320" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ITEMS</text>
    <text x="470" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STATUS</text>
    <text x="610" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ACTIONS</text>

    <!-- Row 1 -->
    <g transform="translate(0, 38)">
      <line x1="0" y1="46" x2="740" y2="46" stroke="#1e293b" stroke-width="1" />
      <text x="24" y="28" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">#OM-2048</text>
      <text x="140" y="28" fill="#f8fafc" font-family="'Geist', sans-serif" font-size="13">Rahul Sharma (Table 4)</text>
      <text x="320" y="28" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="12">3 items • ₹780</text>
      <rect x="470" y="12" width="86" height="22" rx="11" fill="#ffbd2e" fill-opacity="0.15" stroke="#ffbd2e" stroke-width="1" />
      <text x="513" y="27" fill="#ffbd2e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Processing</text>
      <rect x="610" y="12" width="70" height="22" rx="4" fill="#161f30" stroke="#1e293b" stroke-width="1" />
      <text x="645" y="27" fill="#e1e2ec" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Manage</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 84)">
      <line x1="0" y1="46" x2="740" y2="46" stroke="#1e293b" stroke-width="1" />
      <text x="24" y="28" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">#OM-2047</text>
      <text x="140" y="28" fill="#f8fafc" font-family="'Geist', sans-serif" font-size="13">Sneha Patel (Takeaway)</text>
      <text x="320" y="28" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="12">2 items • ₹450</text>
      <rect x="470" y="12" width="86" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <text x="513" y="27" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Dispatched</text>
      <rect x="610" y="12" width="70" height="22" rx="4" fill="#161f30" stroke="#1e293b" stroke-width="1" />
      <text x="645" y="27" fill="#e1e2ec" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Manage</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 130)">
      <line x1="0" y1="46" x2="740" y2="46" stroke="#1e293b" stroke-width="1" />
      <text x="24" y="28" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">#OM-2046</text>
      <text x="140" y="28" fill="#f8fafc" font-family="'Geist', sans-serif" font-size="13">Vikram Desai (Table 9)</text>
      <text x="320" y="28" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="12">5 items • ₹1,290</text>
      <rect x="470" y="12" width="86" height="22" rx="11" fill="#27c93f" fill-opacity="0.15" stroke="#27c93f" stroke-width="1" />
      <text x="513" y="27" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Delivered</text>
      <rect x="610" y="12" width="70" height="22" rx="4" fill="#161f30" stroke="#1e293b" stroke-width="1" />
      <text x="645" y="27" fill="#e1e2ec" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Details</text>
    </g>
  </g>
</svg>
