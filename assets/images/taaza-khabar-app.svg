<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#141926" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#app-bg)" rx="8" />
  <rect width="800" height="450" fill="none" stroke="#1e293b" stroke-width="1.5" rx="8" />

  <!-- Device Frame Mockup Center -->
  <!-- Left info & feature callouts -->
  <g transform="translate(60, 90)">
    <rect width="180" height="28" rx="4" fill="#161f30" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="19" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">📱 MOBILE APPLICATION</text>
    <text x="0" y="70" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">Taaza Khabar</text>
    <text x="0" y="98" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Mobile News Reader</text>
    <text x="0" y="140" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="13">A user-focused news application interface engineered for quick reading, structured category feeds, and seamless browsing on mobile devices.</text>
    
    <g transform="translate(0, 200)">
      <circle cx="10" cy="10" r="4" fill="#00f2fe" />
      <text x="24" y="14" fill="#e1e2ec" font-family="'JetBrains Mono', monospace" font-size="12">Convenient UI Flow</text>
      <circle cx="10" cy="36" r="4" fill="#00f2fe" />
      <text x="24" y="40" fill="#e1e2ec" font-family="'JetBrains Mono', monospace" font-size="12">Instant Article Views</text>
      <circle cx="10" cy="62" r="4" fill="#00f2fe" />
      <text x="24" y="66" fill="#e1e2ec" font-family="'JetBrains Mono', monospace" font-size="12">Clean Dark Palette</text>
    </g>
  </g>

  <!-- Mobile Phone Device (Center/Right) -->
  <g transform="translate(480, 25)">
    <!-- Outer Phone Shadow / Border -->
    <rect x="-4" y="-4" width="248" height="408" rx="36" fill="#1e293b" />
    <rect x="0" y="0" width="240" height="400" rx="32" fill="#0b0f19" stroke="#334155" stroke-width="2" />
    
    <!-- Phone Notch / Dynamic Island -->
    <rect x="85" y="10" width="70" height="16" rx="8" fill="#1e293b" />
    <circle cx="140" cy="18" r="3" fill="#00f2fe" />

    <!-- App Top Bar -->
    <text x="20" y="52" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Taaza Khabar</text>
    <circle cx="218" cy="48" r="12" fill="#161f30" />
    <circle cx="218" cy="48" r="4" fill="#94a3b8" />

    <!-- Category Pills -->
    <rect x="18" y="68" width="52" height="22" rx="11" fill="#00f2fe" />
    <text x="44" y="83" fill="#080b12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">Feed</text>

    <rect x="76" y="68" width="56" height="22" rx="11" fill="#161f30" stroke="#1e293b" stroke-width="1" />
    <text x="104" y="83" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Tech</text>

    <rect x="138" y="68" width="56" height="22" rx="11" fill="#161f30" stroke="#1e293b" stroke-width="1" />
    <text x="166" y="83" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">India</text>

    <!-- Card 1 (Hero Card) -->
    <g transform="translate(18, 102)">
      <rect width="204" height="125" rx="8" fill="#131b29" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="204" height="60" rx="8 8 0 0" fill="#1a2538" />
      <path d="M 10 50 L 50 20 L 90 40 L 140 15 L 190 45" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="10" y="78" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">New Semiconductor Park</text>
      <text x="10" y="94" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="10">Major investments announced in state.</text>
      <text x="10" y="112" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="9">Read article • 5m</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(18, 238)">
      <rect width="204" height="64" rx="8" fill="#131b29" stroke="#1e293b" stroke-width="1" />
      <rect x="8" y="8" width="48" height="48" rx="4" fill="#1c273c" />
      <circle cx="32" cy="32" r="10" fill="#38bdf8" fill-opacity="0.3" />
      <text x="64" y="26" fill="#e1e2ec" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">AI Education Hubs</text>
      <text x="64" y="42" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="9">Colleges adopt new curricula.</text>
      <text x="64" y="56" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8">18m ago</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(18, 312)">
      <rect width="204" height="40" rx="8" fill="#131b29" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#e1e2ec" font-family="'Space Grotesk', sans-serif" font-size="11">Global Market Updates</text>
    </g>

    <!-- Bottom App Navigation Bar -->
    <rect x="0" y="356" width="240" height="44" rx="0 0 32 32" fill="#0c101a" stroke="#1e293b" stroke-width="1" />
    <circle cx="45" cy="376" r="6" fill="#00f2fe" />
    <circle cx="120" cy="376" r="6" fill="#475569" />
    <circle cx="195" cy="376" r="6" fill="#475569" />
  </g>
</svg>
